services:
  - type: web
    name: nextmeet-signaling
    runtime: node
    plan: free
    rootDir: nextmeet/server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: CLIENT_URL
        sync: false
      - key: MAX_ROOM_SIZE
        value: 6
